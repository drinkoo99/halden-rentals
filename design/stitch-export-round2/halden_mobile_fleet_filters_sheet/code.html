      if (isChecked) {
        box.className = 'w-4 h-4 rounded-[2px] bg-surface-container-highest flex items-center justify-center group-hover:bg-outline-variant/60 transition-colors';

    });
  });

  const resetBtn = document.getElementById('reset-btn');
  if (resetBtn) {
