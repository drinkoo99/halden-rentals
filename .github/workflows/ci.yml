name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token: the workflow only checks out and verifies code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # No database in CI: MONGODB_URI is deliberately unset, so the build renders the static demo
      # catalogue and no secrets are needed. Integration tests (halden_test on Atlas) run locally only.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
